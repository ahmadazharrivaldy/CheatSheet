name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CheatSheet.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent CheatSheet.app CheatSheet.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatSheet
          path: CheatSheet.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CheatSheet.zip
